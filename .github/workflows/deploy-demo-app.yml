name: Build & Deploy Demo App

on:
  push:
    branches: [main]
    paths: [app/**]

permissions:
  contents: write
  id-token: write

jobs:
  build-and-deploy:
    name: Build, Push, Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Login to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          REPO: cknight17/demo-app
        run: |
          TAG="${GITHUB_SHA::7}"
          IMAGE="${REGISTRY}/${REPO}:${TAG}"
          docker build -t "$IMAGE" app/
          docker push "$IMAGE"
          echo "IMAGE=${IMAGE}" >> "$GITHUB_ENV"
          echo "TAG=${TAG}" >> "$GITHUB_ENV"

      - name: Update deployment image tag
        run: |
          sed -i "s|image: .*cknight17/demo-app:.*|image: ${IMAGE}|" k8s/apps/demo-app/deployment.yaml

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/apps/demo-app/deployment.yaml
          git diff --staged --quiet && echo "No changes" && exit 0
          git commit -m "chore: update demo-app image to ${TAG}"
          git pull --rebase
          git push

      - name: Configure kubectl
        run: |
          aws eks update-kubeconfig --name cknight17-dev --region us-east-1

      - name: Trigger ArgoCD sync
        run: |
          # Get ArgoCD admin password
          ARGOCD_PWD=$(kubectl -n argocd get secret argocd-initial-admin-secret -o jsonpath="{.data.password}" | base64 -d)
          ARGOCD_URL="https://argocd.knighttechnology.net"

          # Login and get token
          TOKEN=$(curl -sk "${ARGOCD_URL}/api/v1/session" \
            -d "{\"username\":\"admin\",\"password\":\"${ARGOCD_PWD}\"}" \
            | jq -r '.token')

          # Trigger a hard refresh on the demo-app
          curl -sk "${ARGOCD_URL}/api/v1/applications/demo-app?refresh=hard" \
            -H "Authorization: Bearer ${TOKEN}"

          echo "ArgoCD refresh triggered"
